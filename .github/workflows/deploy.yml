name: Grid Deploy (reusable)

# Reusable workflow consumed by project repos via:
#
#   jobs:
#     deploy:
#       if: github.ref == 'refs/heads/master'
#       needs: ci
#       uses: thanx-ai/grid-tooling/.github/workflows/deploy.yml@master
#       secrets:
#         WINDMILL_DEPLOY_TOKEN: ${{ secrets.WINDMILL_DEPLOY_TOKEN }}
#
# Pushes the FULL f/** inventory, one item at a time, with `wmill <type>
# push`. `wmill push` content-hashes each item and no-ops the unchanged
# ones, so pushing everything every deploy is cheap — and it makes a missed
# deploy self-heal: an item that never reached the workspace (CI was broken
# when it landed, or an earlier deploy skipped it) just gets pushed on the
# next deploy, with no commit-range diffing to get wrong. See
# claude/rules/deploy-full-inventory.md.
#
# Never `wmill sync push` — that would let one project repo's deploy delete
# items owned by another. See claude/rules/per-item-push-not-sync.md for the
# design rationale and the verified CLI surface.
#
# Push order is dependency order: folders, then runnables/data (bun scripts
# after the local files they import, so a first push never builds a lock
# against a missing import — claude/rules/deploy-script-import-order.md),
# then schedules/triggers.
#
# Optional, off by default: `test_retries` re-runs only the FAILED deploy
# tests (after `test_retry_delay_seconds`) and annotates any test that passed
# only on a retry, e.g.
#
#       with:
#         test_retries: 2

on:
  workflow_call:
    inputs:
      base_url:
        type: string
        default: "https://grid-origin.thanx.com"
        description: Windmill API base URL.
      workspace:
        type: string
        default: "thanx"
        description: Target Windmill workspace name.
      wmill_version:
        type: string
        default: "1.700.1"
        description: windmill-cli version to install.
      skip_tests:
        type: boolean
        default: false
        description: Skip the post-push deploy tests. Use sparingly — tests are how we catch regressions.
      test_retries:
        type: number
        default: 0
        description: Re-run only the FAILED deploy tests up to this many extra rounds before failing the job. A test that passes only on a retry still passes but gets a warning annotation so the flake stays visible; one that fails every attempt fails the job as before. 0 (default) means no retries, the original behaviour.
      test_retry_delay_seconds:
        type: number
        default: 30
        description: Seconds to wait before each test_retries round (lets a cold or busy worker recover). Ignored when test_retries is 0.
    secrets:
      WINDMILL_DEPLOY_TOKEN:
        required: true
        description: Token with write scopes across folders, scripts, flows, apps, raw_apps, resources, variables, schedules, triggers (or unscoped).

# Serialize deploys per caller repo so two PRs merging back-to-back
# don't race against each other.
concurrency:
  group: grid-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Grid
    runs-on: ubuntu-latest
    env:
      WMILL_BASE_URL: ${{ inputs.base_url }}
      WMILL_WORKSPACE: ${{ inputs.workspace }}
    steps:
      - name: Checkout caller repo
        # Default shallow checkout is fine: the deploy enumerates the
        # inventory with `git ls-files` (reads the index), not a commit-range
        # `git diff`, so no history is needed.
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid-tooling (for shared scripts)
        # See claude/rules/reusable-workflow-meta-checkout.md — `master`
        # because github.job_workflow_sha is empty for external callers.
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid-tooling
          ref: master
          path: .grid-meta

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wmill CLI
        run: npm install -g windmill-cli@${{ inputs.wmill_version }}

      - name: Push all Grid items
        # Pushes the full f/** inventory per-item; `wmill push` no-ops the
        # unchanged ones via its content-hash check. Master-only (the whole
        # job is master-gated by the caller). See
        # claude/rules/deploy-full-inventory.md.
        env:
          WINDMILL_DEPLOY_TOKEN: ${{ secrets.WINDMILL_DEPLOY_TOKEN }}
        run: bash .grid-meta/scripts/deploy-grid-items.sh

      - name: Run deploy tests
        if: ${{ !inputs.skip_tests }}
        env:
          WINDMILL_DEPLOY_TOKEN: ${{ secrets.WINDMILL_DEPLOY_TOKEN }}
          DEPLOY_TEST_RETRIES: ${{ inputs.test_retries }}
          DEPLOY_TEST_RETRY_DELAY_SECONDS: ${{ inputs.test_retry_delay_seconds }}
        run: bash .grid-meta/scripts/run-deploy-tests.sh
